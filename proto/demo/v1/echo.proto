syntax = "proto3";

package demo.v1;

option go_package = "github.com/dunkymole/proto-contract/gen/go/demo/v1;demov1";
option java_multiple_files = true;
option java_package = "io.github.dunkymole.protocontract.demo.v1";
option csharp_namespace = "ProtoContract.Demo.V1";

service EchoService {
  rpc Echo(EchoRequest) returns (EchoResponse);
  rpc EchoClientStream(stream EchoRequest) returns (EchoResponse);
  rpc EchoServerStream(EchoRequest) returns (stream EchoResponse);
  rpc EchoDuplex(stream EchoRequest) returns (stream EchoResponse);
}

// Deliberately has no generated contract; runtime tests verify strict dispatch rejects it.
service UnprotectedService {
  rpc Call(EchoRequest) returns (EchoResponse);
}

message EchoRequest {
  string text = 1;
  string request_id = 2;
}

message EchoResponse {
  string text = 1;
  string server_language = 2;
}
