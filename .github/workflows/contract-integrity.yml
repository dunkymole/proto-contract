name: Contract integrity

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: contract-integrity-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate contract and release history
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE_PROJECT_NAME: proto-contract-validation-${{ github.run_id }}-${{ github.run_attempt }}
      GRPC_BRIDGE_REPOSITORY: https://github.com/dunkymole/grpc-bridge.git
      GRPC_BRIDGE_REF: 87f0e1c86dcd53b64cd24948962ced5b3fc38f99
    steps:
      - name: Check out proposed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler jq

      - name: Test compiler and validator
        run: go test ./...

      - name: Vet compiler and validator
        run: go vet ./...

      - name: Test custom options with source retention
        run: |
          curl --fail --location --retry 3 \
            https://github.com/protocolbuffers/protobuf/releases/download/v33.0/protoc-33.0-linux-x86_64.zip \
            --output "$RUNNER_TEMP/protoc.zip"
          echo "d99c011b799e9e412064244f0be417e5d76c9b6ace13a2ac735330fa7d57ad8f  $RUNNER_TEMP/protoc.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          PATH="$RUNNER_TEMP/protoc/bin:$PATH" go test ./internal/contract -run '^TestProtoc' -count=1 -v
          PATH="$RUNNER_TEMP/protoc/bin:$PATH" bash scripts/test-custom-options.sh
          PATH="$RUNNER_TEMP/protoc/bin:$PATH" bash scripts/test-editions.sh

      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Test release assets and checksum failure handling
        run: python3 -m unittest discover -s packaging -p 'test_release*.py'

      - name: Build compiler for check report
        run: go build -o "$RUNNER_TEMP/proto-contract" ./cmd/proto-contract

      - name: Check proto and release against trusted base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          PROTO_CONTRACT_BIN: ${{ runner.temp }}/proto-contract
        run: |
          set -euo pipefail
          git show "${BASE_SHA}:contracts/demo.echo.json" > "$RUNNER_TEMP/base-demo.echo.json"
          base_args=()
          if git cat-file -e "${BASE_SHA}:contracts/releases.json" 2>/dev/null; then
            git show "${BASE_SHA}:contracts/releases.json" > "$RUNNER_TEMP/base-releases.json"
            base_args=(--base-history "$RUNNER_TEMP/base-releases.json")
          fi
          scripts/ci-contract-check.sh \
            --proto proto/demo/v1/echo.proto \
            --proto-path proto \
            --service demo.v1.EchoService \
            --lock contracts/demo.echo.json \
            --base-lock "$RUNNER_TEMP/base-demo.echo.json" \
            "${base_args[@]}" \
            --history contracts/releases.json

      - name: Test CI contract-check report and failure handling
        env:
          PROTO_CONTRACT_BIN: ${{ runner.temp }}/proto-contract
        run: bash scripts/test-ci-contract-check.sh

      - name: Build packages, verify starter and run interoperability matrix
        run: pwsh ./scripts/test-packages.ps1

      - name: Retain tested npm compiler for native host checks
        uses: actions/upload-artifact@v4
        with:
          name: npm-native-${{ github.run_id }}
          path: artifacts/packages/npm/*.tgz
          if-no-files-found: error
          retention-days: 7

      - name: Verify inferred names against native protobuf generators
        run: pwsh ./scripts/test-naming.ps1

      - name: Run the versioned rollout scenario
        run: pwsh ./scripts/test-rollout.ps1

      - name: Record Compose diagnostics and clean the matrix project
        if: always()
        run: |
          docker compose --project-name "$COMPOSE_PROJECT_NAME" logs --no-color || true
          docker compose --project-name "$COMPOSE_PROJECT_NAME" down --remove-orphans || true

  npm-native-smoke:
    name: npm compiler native smoke (${{ matrix.os }})
    needs: validate
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: npm-native-${{ github.run_id }}
          path: artifacts/npm-native
      - name: Exercise installed native commands and plugin protocol
        shell: pwsh
        run: |
          $package = @(Get-ChildItem -LiteralPath artifacts/npm-native -Filter '*.tgz')
          if ($package.Count -ne 1) { throw 'Expected exactly one tested npm tarball' }
          node npm/test-native-smoke.cjs $package[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Native npm smoke failed' }

  release-dry-run:
    name: Dry run the next package version (no publication)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GRPC_BRIDGE_REPOSITORY: https://github.com/dunkymole/grpc-bridge.git
      GRPC_BRIDGE_REF: 87f0e1c86dcd53b64cd24948962ced5b3fc38f99
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned source-retention compiler
        run: |
          curl --fail --location --retry 3 \
            https://github.com/protocolbuffers/protobuf/releases/download/v33.0/protoc-33.0-linux-x86_64.zip \
            --output "$RUNNER_TEMP/protoc.zip"
          echo "d99c011b799e9e412064244f0be417e5d76c9b6ace13a2ac735330fa7d57ad8f  $RUNNER_TEMP/protoc.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
      - name: Prepare and inspect the next version without publication
        run: python scripts/test-release-dry-run.py
      - name: Retain dry-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-process-dry-run-${{ github.run_id }}
          path: |
            artifacts/release-dry-run-*/candidate/*
            artifacts/release-dry-run-*/DRY_RUN_REPORT.json
          if-no-files-found: warn
          retention-days: 30
