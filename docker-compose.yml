services:
  grpc-bridge:
    build:
      context: .
      dockerfile: examples/clients/grpc-bridge/Dockerfile
      target: bridge
      args:
        GRPC_BRIDGE_REPOSITORY: ${GRPC_BRIDGE_REPOSITORY:-https://github.com/dunkymole/grpc-bridge.git}
        GRPC_BRIDGE_REF: ${GRPC_BRIDGE_REF:-56a7fc57078d4003553a4b0e5ec048c4bf9abef2}
    environment:
      DEFAULT_TARGET: go
  grpc-bridge-client:
    build:
      context: .
      dockerfile: examples/clients/grpc-bridge/Dockerfile
      target: client
      args:
        GRPC_BRIDGE_REPOSITORY: ${GRPC_BRIDGE_REPOSITORY:-https://github.com/dunkymole/grpc-bridge.git}
        GRPC_BRIDGE_REF: ${GRPC_BRIDGE_REF:-56a7fc57078d4003553a4b0e5ec048c4bf9abef2}
  dotnet-server:
    build:
      context: .
      dockerfile: examples/servers/dotnet/Dockerfile
  go-server:
    build:
      context: .
      dockerfile: examples/servers/go/Dockerfile
  java-server:
    build:
      context: .
      dockerfile: examples/servers/java/Dockerfile
  python-server:
    build:
      context: .
      dockerfile: examples/servers/python/Dockerfile
  dotnet-client:
    build:
      context: .
      dockerfile: examples/clients/dotnet/Dockerfile
  go-client:
    build:
      context: .
      dockerfile: examples/clients/go/Dockerfile
  java-client:
    build:
      context: .
      dockerfile: examples/clients/java/Dockerfile
  python-client:
    build:
      context: .
      dockerfile: examples/clients/python/Dockerfile
